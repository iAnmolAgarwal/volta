<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#383b34" />
    <meta name="description" content="Forecast every hour of microgrid demand, then route it through the grid, the battery or the sun before the peak arrives." />
    <!-- Lexend (latin, variable weight) is the hero's face: fetch it with the HTML, not after the CSS; the @font-face keeps font-display: swap -->
    <link rel="preload" href="/node_modules/@fontsource-variable/lexend/files/lexend-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%234a4d44'/%3E%3Cpath fill='%23eef1e7' d='M13.2 3.5 6 13.4h5.2L10.4 20.5 18 10.4h-5.3z'/%3E%3C/svg%3E" />
    <!-- the wordmark lives in src/lib/brand.ts, which sets this title at runtime; keep the two in step -->
    <title>VOLTA · Smart Energy Microgrid</title>
    <!-- Slate serves this page with a one-year cache header we can't change. If a stale copy asks
         for a bundle that is gone, reload once (a reload revalidates the page itself). -->
    <script>
      (function () {
        var KEY = "volta:asset-reload", failed = false;
        addEventListener("error", function (e) {
          var el = e.target, url = el && (el.href || el.src);
          if (!url || !/\/assets\//.test(url) || !/^(LINK|SCRIPT)$/.test(el.tagName)) return;
          failed = true;
          try { if (sessionStorage.getItem(KEY)) return; sessionStorage.setItem(KEY, "1"); } catch (_) { return; }
          location.reload();
        }, true);
        // a clean load re-arms the guard for the next deploy; a failed one never loops
        addEventListener("load", function () { if (!failed) try { sessionStorage.removeItem(KEY); } catch (_) {} });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
